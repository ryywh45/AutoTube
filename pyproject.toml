[project]
name = "autotube"
version = "0.1.0"
description = "Automated YouTube video production system using multi-agent AI workflows"
readme = "README.md"
authors = [
    { name = "James Yang", email = "ryywh45@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.69.0",
    "pillow>=12.1.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
